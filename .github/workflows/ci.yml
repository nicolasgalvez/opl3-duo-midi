name: CI

# Thin orchestrator: every check lives in its own reusable workflow so it can be
# run, edited, or required independently. Add a check by adding a workflow file
# and one `uses:` line here.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  firmware:
    uses: ./.github/workflows/firmware.yml
