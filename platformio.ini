; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
; USB type = MIDI + Serial: exposes a USB-MIDI port (named "OPL3Duo MIDI") to
; Ableton, while keeping a USB serial port for debugging and clean uploads.
build_flags =
	-D USB_MIDI_SERIAL
lib_deps =
	https://github.com/DhrBaksteen/ArduinoOPL2.git
	; Encoder and Bounce2 are bundled with Teensyduino — no entry needed.
	; Uncomment the two lines below when you set OLED_ENABLED to 1 in Config.h:
	; adafruit/Adafruit SSD1306@^2.5.13
	; adafruit/Adafruit GFX Library@^1.11.11

; ---------------------------------------------------------------------------
; Host tests. `pio test -e native -f native`
;
; The synth's decisions -- which voice takes a note, which register is written,
; what the modulation LFO does to a voice that has been released -- are ordinary
; C++ and were untestable only because every file starts with <Arduino.h>.
; test_support supplies just enough of Arduino and SPI to build; the OPL3 library
; itself is the real one, so the tests read the frequencies it would have sent
; out of its own shadow registers rather than out of a mock.
;
; Only OplSynth is built here. main.cpp is usbMIDI and Teensy pins, and the
; encoder and display are hardware this cannot say anything about.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
test_build_src = yes
; The OPL3 library declares itself for the Arduino framework, and this
; environment has none, so the compatibility check would refuse to build it.
lib_compat_mode = off
build_src_filter = +<OplSynth.cpp>
build_flags =
	-std=c++17
	-I test_support
	-I src
lib_deps =
	https://github.com/DhrBaksteen/ArduinoOPL2.git
